name: Gerar APK KLG Block

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KLG_Block_1.9.apk

      - name: Disponibilizar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: KLG_Block_1.9_APK
          path: KLG_Block_1.9.apk
          if-no-files-found: error
